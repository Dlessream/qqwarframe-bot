version: "3.8"

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      MODE: ws
      WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:?请先运行 deploy/oneclick.sh 生成 .env}
    ports:
      - "${WEBUI_BIND:-127.0.0.1}:6099:6099"
    volumes:
      - ./napcat/qq:/app/.config/QQ
      - ./napcat/config:/app/napcat/config
      - ./napcat/plugins:/app/napcat/plugins

  xray:
    image: teddysun/xray:latest
    container_name: qqwarframe-xray
    restart: unless-stopped
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro

  bot:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}
    container_name: qqwarframe-bot
    restart: unless-stopped
    depends_on:
      - napcat
      - xray
    environment:
      TZ: Asia/Shanghai
      QQWF_WS_URL: ws://napcat:3001
      QQWF_ACCESS_TOKEN: ${NAPCAT_WS_TOKEN:-}
      QQWF_PROXY: http://xray:10809
      QQWF_WIKI_PROXY: http://xray:10809
      QQWF_WORLDSTATE_PROXY: http://xray:10809
      QQWF_ARBI_PROXY: http://xray:10809
      QQWF_IMAGE: "1"
      QQWF_ALERTS: "1"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
