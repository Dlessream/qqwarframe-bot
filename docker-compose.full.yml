version: "3.8"

services:
  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      MODE: ws
      WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:?请先运行 deploy/oneclick.sh 生成 .env}
    ports:
      - "${WEBUI_BIND:-127.0.0.1}:6099:6099"
    volumes:
      - ./napcat/qq:/app/.config/QQ
      - ./napcat/config:/app/napcat/config
      - ./napcat/plugins:/app/napcat/plugins

  xray:
    image: teddysun/xray:latest
    container_name: qqwarframe-xray
    restart: unless-stopped
    volumes:
      - ./xray/config.json:/etc/xray/config.json:ro

  bot:
    build:
      context: .
      args:
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        APT_MIRROR: ${APT_MIRROR:-mirrors.tuna.tsinghua.edu.cn}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.11-slim}
        BUILD_COMMIT: ${BUILD_COMMIT:-}
    container_name: qqwarframe-bot
    restart: unless-stopped
    depends_on:
      - napcat
      - xray
    ports:
      - "${WEB_ADMIN_BIND:-127.0.0.1}:${WEB_ADMIN_PORT:-8080}:8080"
    environment:
      TZ: Asia/Shanghai
      QQWF_WS_URL: ws://napcat:3001
      QQWF_ACCESS_TOKEN: ${NAPCAT_WS_TOKEN:-}
      QQWF_PROXY: http://xray:10809
      QQWF_WIKI_PROXY: http://xray:10809
      QQWF_WORLDSTATE_PROXY: http://xray:10809
      QQWF_ARBI_PROXY: http://xray:10809
      QQWF_IMAGE: "1"
      QQWF_ALERTS: "1"
      QQWF_FONT: ${QQWF_FONT:-}
      QQWF_FONT_BOLD: ${QQWF_FONT_BOLD:-}
      QQWF_WEB_HOST: 0.0.0.0
      QQWF_WEB_PORT: "8080"
      QQWF_WEB_TOKEN: ${WEB_ADMIN_TOKEN:-}
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
