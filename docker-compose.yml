version: "3.8"

services:
  bot:
    build: .
    container_name: qqwarframe-bot
    restart: unless-stopped
    # Linux 下用 host 网络最简单：容器里的 127.0.0.1 就是宿主机
    network_mode: host
    environment:
      TZ: Asia/Shanghai
      # QQ 开放平台官方机器人凭证与连接方式（websocket 反向 / webhook 正向）
      QQWF_APP_ID: ${QQWF_APP_ID:-}
      QQWF_APP_SECRET: ${QQWF_APP_SECRET:-}
      QQWF_TRANSPORT: ${QQWF_TRANSPORT:-websocket}
      QQWF_QQBOT_ENV: ${QQWF_QQBOT_ENV:-prod}
      QQWF_CALLBACK_PATH: ${QQWF_CALLBACK_PATH:-/qq/callback}
      # 宿主机上的 v2rayN/Clash HTTP 代理端口
      QQWF_PROXY: http://127.0.0.1:10809
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./logs:/app/logs
